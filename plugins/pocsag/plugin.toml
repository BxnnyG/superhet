# POCSAG (512/1200/2400 baud) and FLEX pagers, decoded by multimon-ng (a separate GPL-2.0 process).
# Bind it to an NFM VFO on the paging channel (12.5 kHz); config keys (all optional):
#   baud = [512, 1200, 2400], flex = true, invert = "auto" | true | false, charset = "US|FR|DE|DK|SE|SI"

[plugin]
id = "org.superhet.decoder.pocsag"
name = "POCSAG / FLEX pagers"
version = "0.1.0"
protocol = 1
license = "AGPL-3.0-only"
type = "decoder"
description = "Decodes POCSAG and FLEX pager traffic with multimon-ng: address, function, text or digits, baud rate"
homepage = "https://github.com/BxnnyG/superhet"

[runtime]
kind = "process"
transport = "simple"
command = ["superhet-plugin-adapter", "pocsag"]

[input]
kind = "discriminator"
sample_rate = 22050
format = "s16le"
bandwidth_hz = 12500

[output]
events_schema = "schema/events.json"

[config]
schema = "schema/config.json"

[install]
acknowledge = { text = "Runs multimon-ng (GPL-2.0-or-later) as a separate process. Pager messages are private communications in many countries: receiving or storing the content of pages that are not addressed to you may be restricted or forbidden (in Germany, for example, by the secrecy of telecommunications). Decoded messages are kept in the decoder history until the retention period ends. Use this only where you are allowed to.", url = "https://github.com/EliasOenal/multimon-ng" }
