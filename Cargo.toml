[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/BxnnyG/superhet"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream", "nkeys"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = "0.3"

superhet-bus = { path = "crates/superhet-bus" }
superhet-db = { path = "crates/superhet-db" }
