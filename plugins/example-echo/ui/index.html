<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Echo view</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <h1>Echo view</h1>
    <p id="status" class="muted" role="status">Waiting for the host...</p>
    <h2>Instances</h2>
    <ul id="instances" aria-label="Instances"></ul>
    <h2>Events</h2>
    <ol id="events" aria-label="Events"></ol>
    <p>
      <button id="tune" type="button" disabled>Tune to 100.000 MHz</button>
      <span id="tune-note" class="muted"></span>
    </p>
    <script src="panel.js"></script>
  </body>
</html>
