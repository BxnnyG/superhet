[package]
name = "superhet-pluginhost"
description = "Superhet plugin host: supervises out-of-process plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "superhet-pluginhost"
path = "src/main.rs"

[dependencies]
async-nats.workspace = true
axum.workspace = true
futures-util.workspace = true
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superhet-bus.workspace = true
superhet-plugin-protocol.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["process", "io-util", "time", "fs", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
