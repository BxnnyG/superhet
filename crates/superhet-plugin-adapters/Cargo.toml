[package]
name = "superhet-plugin-adapters"
description = "Adapters that run external decoders (multimon-ng, direwolf, rtl_433, welle-cli) as Superhet plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "superhet-plugin-adapter"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = "1"
# Pure-Rust MP3 decoder (MPL-2.0): welle-cli hands the audio of a DAB service over as an MP3
# stream, the DAB plugin decodes it to PCM for the host.
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
superhet-dsp.workspace = true
superhet-plugin-protocol.workspace = true

[lints]
workspace = true
