# NATS server configuration for the Superhet compose stack.
# Passwords come from environment variables (see compose.yaml / .env).
# Subject layout: see crates/superhet-bus/src/subjects.rs (sh.v1.*).

server_name: superhet-nats
port: 4222

# Monitoring endpoint; the port is not published to the host.
http: 8222

jetstream {
    store_dir: "/data"
}

accounts {
    SUPERHET {
        jetstream: enabled
        users = [
            # API edge: sends control requests, reads everything (incl. the STATE KV bucket via
            # $JS.API and the VFO audio streams sh.v1.dev.*.audio.*), manages its own JetStream
            # consumers.
            {
                user: "api"
                password: $NATS_API_PASSWORD
                permissions {
                    publish {
                        allow: ["sh.v1.dev.*.ctl.>", "sh.v1.plugin.*.ctl", "sh.v1.lookup.>", "sh.v1.events.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.>", "_INBOX.>"]
                    }
                }
            }
            # SDR daemon: serves control requests and publishes everything of its own device domain.
            # Forward compatible on purpose: it may publish ANY subject below sh.v1.dev.<id>.> (state,
            # spectrum[.zoom], audio.*, rds.*, and whatever a newer image adds) except the control
            # namespace ctl.>, which only the api may publish to (the daemon merely answers via
            # allow_responses). Users replace compose.yaml/nats.conf separately from the image, so a
            # per-subject list silently breaks newer images (NATS drops denied publishes without error).
            # The $KV/$JS.API entries let it create the STATE KV bucket and read/write its keys
            # dev.<id> (live state) and restore.<id> (snapshot restored on the next start).
            {
                user: "sdrd"
                password: $NATS_SDRD_PASSWORD
                permissions {
                    publish {
                        allow: [
                            "sh.v1.dev.*.>",
                            "$KV.STATE.>",
                            "$JS.API.INFO", "$JS.API.STREAM.INFO.KV_STATE", "$JS.API.STREAM.CREATE.KV_STATE",
                            "$JS.API.DIRECT.GET.KV_STATE.>"
                        ]
                        deny: ["sh.v1.dev.*.ctl.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.dev.*.ctl.>", "_INBOX.>"]
                    }
                    allow_responses: true
                }
            }
            # Plugin host: consumes audio, publishes plugin events.
            {
                user: "pluginhost"
                password: $NATS_PLUGINHOST_PASSWORD
                permissions {
                    publish {
                        allow: ["sh.v1.events.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.dev.*.audio.>", "sh.v1.plugin.*.ctl", "sh.v1.lookup.>", "_INBOX.>"]
                    }
                    allow_responses: true
                }
            }
            # Worker: consumes and produces events, durable JetStream consumers. It also records
            # the decoder history: it reads the tone / RDS / state subjects of every device (and
            # the STATE KV bucket through $JS.API) and announces stored events on
            # sh.v1.events.core.decoder.<dev>.
            {
                user: "worker"
                password: $NATS_WORKER_PASSWORD
                permissions {
                    publish {
                        allow: ["sh.v1.events.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.events.>", "sh.v1.dev.*.state", "sh.v1.dev.*.tones.>", "sh.v1.dev.*.rds.>", "_INBOX.>"]
                    }
                    allow_responses: true
                }
            }
        ]
    }
}
