<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Invitation links carry a secret in the path: never send it as a referrer. -->
    <meta name="referrer" content="same-origin" />
    <title>Superhet</title>
    <!-- Link previews: static text only, never anything about a station, link or visitor. -->
    <meta name="description" content="Live software-defined radio receiver in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Superhet" />
    <meta property="og:title" content="Superhet live receiver" />
    <meta
      property="og:description"
      content="Listen to a live software-defined radio receiver in your browser: waterfall and audio."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
