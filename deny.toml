# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `rsa` / `crypto-bigint` arrive with `openidconnect` (OIDC login, ADR-0019). Both advisories
    # concern timing side channels on secret integers, i.e. private-key operations (decryption,
    # signing). Superhet only verifies ID-token signatures with the identity provider's public
    # keys; it never holds or uses an RSA private key. Re-check when openidconnect moves on.
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack; public-key verification only (ADR-0019)" },
    { id = "RUSTSEC-2026-0387", reason = "constant-time issues on secret integers; public-key verification only (ADR-0019)" },
]

[licenses]
version = 2
# Permissive licenses compatible with AGPL-3.0-only.
allow = [
    "AGPL-3.0-only", # the workspace crates themselves
    "MIT",
    "MIT-0",         # borrow-or-share (via jsonschema in superhet-plugin-protocol)
    "0BSD",          # quoted_printable (via lettre in superhet-notify), permissive like MIT-0
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
