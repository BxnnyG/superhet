name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: superhet
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: superhet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superhet -d superhet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://superhet:ci-only-password@localhost:5432/superhet
      SUPERHET_NATS_URL: nats://localhost:4222
      # The *_live tests are gated on this variable and skip silently without it.
      SUPERHET_TEST_NATS_URL: nats://localhost:4222
      # The golden tests of the decoder plugins fail (instead of skipping) when a tool is missing.
      SUPERHET_REQUIRE_PLUGIN_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      # Service containers cannot take command arguments, so start NATS with JetStream by hand.
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.15.1-alpine -js -m 8222
          for _ in $(seq 1 30); do
            wget -q -O /dev/null http://localhost:8222/healthz && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      # superhet-sdrd links the system libopus dynamically (superhet-bus feature opus).
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev
      # External decoders of the first-party plugins (golden tests, crates/superhet-plugin-adapters).
      - name: Install plugin decoders
        run: sudo apt-get install -y --no-install-recommends multimon-ng direwolf rtl-433
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The API live tests spawn target/debug/superhet-{sdrd,pluginhost,worker}; build them
      # explicitly rather than relying on the workspace test build to leave them there.
      - run: cargo build -p superhet-sdrd -p superhet-pluginhost -p superhet-worker
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: superhet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The recordings of the decoder plugins through the real tools of the runtime image.
      - name: Plugin golden check in the image
        run: scripts/check-plugin-image.sh superhet:ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Browser smoke test of the multi-user flow (docs/ROADMAP.md P1.5 criterion 8): a throwaway
  # stack (api + sdrd with a file device + worker on a fresh PostgreSQL and NATS) driven by
  # Playwright in Chromium. scripts/e2e-stack.sh starts the stack, web/e2e holds the scenario.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: superhet
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: superhet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superhet -d superhet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPERHET_DATABASE_URL: postgres://superhet:ci-only-password@localhost:5432/superhet
      SUPERHET_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v7
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.15.1-alpine -js -m 8222
          for _ in $(seq 1 30); do
            wget -q -O /dev/null http://localhost:8222/healthz && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - run: cargo build -p superhet-api -p superhet-sdrd -p superhet-worker -p superhet-pluginhost -p superhet-plugin-adapters
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # The browser download is cached by Playwright version; the system libraries are not.
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        working-directory: web
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Browser smoke test
        working-directory: web
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
