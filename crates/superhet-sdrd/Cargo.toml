[package]
name = "superhet-sdrd"
description = "Superhet SDR daemon: owns one SDR device and its DSP chain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "superhet-sdrd"
path = "src/main.rs"

[dependencies]
async-nats.workspace = true
superhet-bus.workspace = true
superhet-device.workspace = true
superhet-dsp.workspace = true
thiserror.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["time"] }
tower.workspace = true
http-body-util.workspace = true

[features]
# RTL-SDR backend (links the system librtlsdr).
rtlsdr = ["superhet-device/rtlsdr"]

[lints]
workspace = true
