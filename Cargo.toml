[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/BxnnyG/superhet"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream", "kv", "nkeys"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "time"] }
thiserror = "2"
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4"] }
time = "0.3"
rustfft = "6"
num-complex = "0.4"

superhet-bus = { path = "crates/superhet-bus" }
superhet-device = { path = "crates/superhet-device" }
superhet-dsp = { path = "crates/superhet-dsp" }
superhet-db = { path = "crates/superhet-db" }

# DSP code is unusably slow unoptimised; keep debug builds and tests responsive.
[profile.dev.package.superhet-dsp]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2
