# NATS server configuration for the Superhet compose stack.
# Passwords come from environment variables (see compose.yaml / .env).
# Subject layout: see crates/superhet-bus/src/subjects.rs (sh.v1.*).

server_name: superhet-nats
port: 4222

# Monitoring endpoint; the port is not published to the host.
http: 8222

jetstream {
    store_dir: "/data"
}

accounts {
    SUPERHET {
        jetstream: enabled
        users = [
            # API edge: sends control requests, reads everything (incl. the STATE KV bucket via
            # $JS.API and the VFO audio streams sh.v1.dev.*.audio.*), manages its own JetStream
            # consumers.
            {
                user: "api"
                password: $NATS_API_PASSWORD
                permissions {
                    publish {
                        allow: ["sh.v1.dev.*.ctl.>", "sh.v1.plugin.*.ctl", "sh.v1.lookup.>", "sh.v1.events.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.>", "_INBOX.>"]
                    }
                }
            }
            # SDR daemon: serves control requests, publishes spectrum, audio and device state.
            # The $KV/$JS.API entries let it create and write the STATE KV bucket (key dev.<id>).
            {
                user: "sdrd"
                password: $NATS_SDRD_PASSWORD
                permissions {
                    publish {
                        allow: [
                            "sh.v1.dev.*.state", "sh.v1.dev.*.spectrum", "sh.v1.dev.*.audio.>",
                            "$KV.STATE.dev.*",
                            "$JS.API.INFO", "$JS.API.STREAM.INFO.KV_STATE", "$JS.API.STREAM.CREATE.KV_STATE"
                        ]
                    }
                    subscribe {
                        allow: ["sh.v1.dev.*.ctl.>", "_INBOX.>"]
                    }
                    allow_responses: true
                }
            }
            # Plugin host: consumes audio, publishes plugin events.
            {
                user: "pluginhost"
                password: $NATS_PLUGINHOST_PASSWORD
                permissions {
                    publish {
                        allow: ["sh.v1.events.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.dev.*.audio.>", "sh.v1.plugin.*.ctl", "sh.v1.lookup.>", "_INBOX.>"]
                    }
                    allow_responses: true
                }
            }
            # Worker: consumes and produces events, durable JetStream consumers.
            {
                user: "worker"
                password: $NATS_WORKER_PASSWORD
                permissions {
                    publish {
                        allow: ["sh.v1.events.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>"]
                    }
                    subscribe {
                        allow: ["sh.v1.events.>", "_INBOX.>"]
                    }
                    allow_responses: true
                }
            }
        ]
    }
}
